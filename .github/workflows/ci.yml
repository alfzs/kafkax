name: CI

on:
  push:
    branches: [main, v2-only]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      # Линтеры живут в отдельном модуле tools/ и ставятся в .tools/ —
      # цели Makefile собирают их сами, поэтому шаг не зависит от того,
      # объявлены ли tool-директивы в основном go.mod.
      - name: Lint
        run: make lint

      - name: Vulnerability check
        run: make audit

  # Отдельная задача, а не шаг предыдущей: интеграционный набор требует Docker и
  # идёт на порядок дольше модульного. Слитые в одну, они лишили бы быструю
  # обратную связь смысла — отказ в юнит-тестах ждал бы конца прогона Kafka.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # KAFKAX_INTEGRATION=required внутри цели: без него отсутствие Docker
      # дало бы пропуск, то есть зелёную задачу, не проверившую ничего.
      - name: Integration tests
        run: make test-integration
