name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Build (integration tag)
        run: go build -tags integration ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Test (integration tag)
        run: go test -race -count=1 -tags=integration ./...

      - name: Lint
        run: go tool golangci-lint run --build-tags=integration ./...

      - name: Vulnerability check
        run: go tool govulncheck ./...
