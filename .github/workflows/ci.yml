name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      # Линтеры живут в отдельном модуле tools/ и ставятся в .tools/ —
      # цели Makefile собирают их сами, поэтому шаг не зависит от того,
      # объявлены ли tool-директивы в основном go.mod.
      - name: Lint
        run: make lint

      - name: Vulnerability check
        run: make audit
